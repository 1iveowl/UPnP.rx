name: CI

on:
  push:
    branches: [main, 'releases/**']
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UPnP.Rx.slnx

      - name: Build
        run: dotnet build UPnP.Rx.slnx --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test tests/UPnP.Rx.Tests/UPnP.Rx.Tests.csproj --no-build -c Release

      - name: Pack
        run: dotnet pack src/UPnP.Rx/UPnP.Rx.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      # Required for NuGet Trusted Publishing: the job exchanges the GitHub OIDC
      # token for a short-lived nuget.org API key — no stored secrets.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Requires a Trusted Publishing policy on nuget.org (profile → Trusted
      # Publishing) for repository 1iveowl/UPnP.rx, workflow ci.yml.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 1iveowl

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
