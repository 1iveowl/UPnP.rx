name: CI

on:
  push:
    branches: [main, 'releases/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UPnP.Rx.slnx

      - name: Build
        run: dotnet build UPnP.Rx.slnx --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test UPnP.Rx.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/UPnP.Rx/UPnP.Rx.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

# Publish on v* tags via NuGet Trusted Publishing lands in Phase 6.
