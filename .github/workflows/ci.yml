name: CI

on:
  push:
    branches: [main, 'releases/**']
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UPnP.Rx.slnx

      - name: Build
        run: dotnet build UPnP.Rx.slnx --no-restore -c Release -warnaserror

      # The SOLUTION, not one project by name. Naming the project is how a sibling
      # repo shipped 50 analyzer tests that CI never ran and nobody noticed until a
      # release-readiness pass. A .slnx handles non-test projects fine, which is what
      # the older note here was worried about.
      - name: Test
        run: dotnet test UPnP.Rx.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/UPnP.Rx/UPnP.Rx.csproj --no-build -c Release -o artifacts

      # Smoke: the library declares IsTrimmable/IsAotCompatible - prove a
      # trimmed publish of a consumer still succeeds, in CI rather than only
      # at declaration time.
      # Both smokes below drop the analyzer PROJECT references (see
      # UpnpRxSkipAnalyzerProjects in Directory.Build.props: netstandard2.0 cannot be
      # trimmed or AOT-compiled, and the property reaches them through the implicit
      # restore). Dropping them also drops the SOURCE GENERATOR, so the generated members
      # of WanIpConnection are absent from these publishes only - and the public-API ledger
      # then reports them missing. RS0016/RS0017 are silenced HERE and only here; the Build
      # step above validated the ledger against the real compilation, which is where that
      # check belongs. A smoke's job is to prove the publish works, not to re-audit the API.
      # IL2121 is suppressed because it is not ours and not actionable: it reports an
      # unused UnconditionalSuppressMessage inside System.Private.CoreLib's own
      # StartupHookProvider, rolled up as IL2104 and promoted to an error by
      # TreatWarningsAsErrors. Expanding the roll-up (TrimmerSingleWarn=false) shows it is
      # the ONLY trim warning - no IL2026/IL2075 from UPnP.Rx or its dependencies - so the
      # library's own trim-cleanliness is still what this step proves.
      - name: Trimmed publish smoke
        run: |
          dotnet publish samples/Sample.Browser -c Release -r linux-x64 --self-contained \
            -p:PublishTrimmed=true -p:NoWarn='RS0016%3BRS0017%3BIL2104%3BIL2121' \
            -o artifacts-trim-smoke

      # IsAotCompatible is a claim; this is the check. Publish natively AND RUN the binary -
      # ILC staying quiet only proves the managed side is clean, not that the result starts.
      #
      # The RID comes from the runner rather than a literal. Hard-coding linux-x64 works here
      # by luck and fails on any arm64 host, where it becomes a cross-compile and the native
      # linker rejects flags meant for another architecture - a failure that reads exactly
      # like a missing toolchain and is not one (see 6.0.0 plan §11e).
      - name: Native AOT publish + run smoke
        run: |
          set -euo pipefail
          rid="linux-$(dpkg --print-architecture | sed 's/amd64/x64/')"
          echo "Publishing native AOT for $rid"
          dotnet publish samples/Sample.PortMapper -c Release -r "$rid" --self-contained \
            -p:PublishAot=true -p:NoWarn='RS0016%3BRS0017' -o artifacts-aot-smoke
          # A native binary, not a folder of DLLs: publishing with --no-restore silently
          # degrades AOT to an ordinary publish (ILCompiler never gets restored), which
          # would make this step pass while proving nothing.
          test -x ./artifacts-aot-smoke/Sample.PortMapper
          # No gateway on a CI runner, so it must exit 0 having said so - not crash on
          # metadata a trimmer removed.
          ./artifacts-aot-smoke/Sample.PortMapper

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.*nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      # Required for NuGet Trusted Publishing: the job exchanges the GitHub OIDC
      # token for a short-lived nuget.org API key — no stored secrets.
      id-token: write
      # Required to create the GitHub release for the tag.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Requires a Trusted Publishing policy on nuget.org (profile → Trusted
      # Publishing) for repository 1iveowl/UPnP.rx, workflow ci.yml.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 1iveowl

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Only after the package is out, so a failed push leaves no release
      # claiming otherwise. Attaches the packages and generates notes from the
      # commit history since the previous tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          artifacts/*.nupkg artifacts/*.snupkg
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --verify-tag
          --generate-notes
